syntax = "proto3";

package nre.plugin.policy.v1;

option go_package = "github.com/sakullla/nginx-reverse-emby/plugin-sdk/go/policyv1";

// nre:policy/v1 uses WebAssembly 2.0 core features, i32/i64 ABI values, and
// protobuf bytes.
// Required guest exports are:
//   memory: memory
//   nre_policy_version() -> i32 (canonical static body: i32.const 1; end)
//   nre_policy_alloc(size: i32) -> i32
//   nre_policy_free(pointer: i32, length: i32)
//   nre_policy_init(pointer: i32, length: i32) -> i32 status
//   nre_policy_evaluate(pointer: i32, length: i32) -> i64 buffer frame
//   nre_policy_reset() -> i32 status
//
// The host calls alloc, writes one protobuf request, calls init/evaluate, and
// calls free exactly once for each non-empty input. InitRequest is a non-empty
// protobuf message whose config, granted_scopes, and generation are consumed
// before OK is returned. Init and evaluate use independent input allocations.
// Evaluate transfers one
// guest allocation to the host as (pointer << 32) | length; the host reads it
// before calling free exactly once. Zero length is encoded as zero and is not
// freed. All ranges are unsigned 32-bit offsets into the exported memory and
// are rejected before wraparound or when they exceed manifest budgets.
// input_bytes and output_bytes are limits on each complete encoded protobuf
// wire frame, including tags, length prefixes, nested envelopes, request IDs,
// generation/grant metadata, and Host request/response framing. They are not
// payload-only limits. A host must marshal the complete frame before admission
// and must not promise a payload field equal to the whole frame budget.
//
// Allowed function imports use module "nre:policy/v1" and names
// nre_host_read_field, nre_host_read_normalized_http,
// nre_host_read_trusted_source, nre_host_dataset_query, nre_host_dataset_resolve,
// nre_host_read_body_window, nre_host_state_get,
// nre_host_state_put, nre_host_emit_event, and nre_host_add_metric. The
// normalized HTTP, trusted source and dataset imports are additive and optional; the original six imports
// remain required for every policy/v1 guest. Every
// signature is (request_ptr: i32, request_len: i32, response_ptr: i32,
// response_capacity: i32) -> i64. Requests and responses are the protobuf
// messages below: read_field uses ReadFieldRequest/BytesResponse,
// read_normalized_http uses an empty ReadNormalizedHTTPRequest and
// NormalizedHTTPResponse,
// read_trusted_source uses empty ReadTrustedSourceRequest/TrustedSourceResponse,
// dataset_query uses DatasetQueryRequest/DatasetQueryResponse. Dataset queries
// require dataset.query AND policy.trusted-source, use only the authenticated
// admission source, and consume the enclosing admission time budget. Hosts must
// resolve opaque references against their instance/generation grant registry.
// There is no request address, trusted flag, remote fetch, or raw data output.
// dataset_resolve uses DatasetResolveRequest/DatasetResolveResponse. This
// optional import requires dataset.resolve AND dataset.query and selects only
// the authenticated instance/generation's prepared source binding. It returns
// the stable opaque reference for that generation, not global latest. It does
// not require a connection source, download data, activate a version or rewrite
// config. Its complete response is bounded to 4 KiB and its time budget is
// included in the enclosing invocation budget; the original six required
// imports are unchanged.
// read_body_window uses ReadBodyWindowRequest/BytesResponse, state_get uses
// StateGetRequest/BytesResponse, and state_put, emit_event, and add_metric use
// their corresponding request with an empty response. The returned frame is
// (status << 32) | response_length.
// A RESOURCE_EXHAUSTED status with a length larger than response_capacity
// writes no partial response and permits a bounded retry. The host never
// allocates guest memory. No other imports, start function, imported memory,
// WASI filesystem/network/process/clock, or raw host memory are allowed.
//
// Status values are stable: OK=0, INVALID_ARGUMENT=1, PERMISSION_DENIED=2,
// RESOURCE_EXHAUSTED=3, DEADLINE_EXCEEDED=4, UNAVAILABLE=5,
// INCOMPATIBLE_ABI=6, INTERNAL=7. EvaluateResponse carries exactly one result:
// success or error. Hosts reject a missing result, conflicting wire fields,
// an unspecified/unknown error code, and malformed frames before dispatch.
enum ABIStatus {
  ABI_STATUS_OK = 0;
  ABI_STATUS_INVALID_ARGUMENT = 1;
  ABI_STATUS_PERMISSION_DENIED = 2;
  ABI_STATUS_RESOURCE_EXHAUSTED = 3;
  ABI_STATUS_DEADLINE_EXCEEDED = 4;
  ABI_STATUS_UNAVAILABLE = 5;
  ABI_STATUS_INCOMPATIBLE_ABI = 6;
  ABI_STATUS_INTERNAL = 7;
}

enum RuntimeErrorCode {
  RUNTIME_ERROR_CODE_UNSPECIFIED = 0;
  RUNTIME_ERROR_CODE_INVALID_ARGUMENT = 1;
  RUNTIME_ERROR_CODE_PERMISSION_DENIED = 2;
  RUNTIME_ERROR_CODE_RESOURCE_EXHAUSTED = 3;
  RUNTIME_ERROR_CODE_DEADLINE_EXCEEDED = 4;
  RUNTIME_ERROR_CODE_UNAVAILABLE = 5;
  RUNTIME_ERROR_CODE_INCOMPATIBLE_ABI = 6;
  RUNTIME_ERROR_CODE_INTERNAL = 7;
}

message InitRequest {
  bytes config = 1;
  repeated string granted_scopes = 2;
  string generation = 3;
}

message EvaluateRequest {
  string extension_point = 1;
  string request_id = 2;
  bytes payload = 3;
  // Canonical NormalizedHTTPResponse bytes supplied in the evaluate frame.
  // New HTTP hosts use this zero-round-trip path; guests retain the additive
  // read_normalized_http import as a compatibility fallback.
  bytes normalized_http = 4;
}

message EvaluateResponse {
  oneof result {
    EvaluateSuccess success = 1;
    RuntimeError error = 2;
  }
}

message EvaluateSuccess {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ALLOW = 1;
    DENY = 2;
    OBSERVE = 3;
  }
  Action action = 1;
  bytes payload = 2;
}

message RuntimeError {
  RuntimeErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

message ReadFieldRequest {
  string name = 1;
}

// ReadNormalizedHTTPRequest is empty so the common WAF path performs one
// guest-to-host transition without guest-controlled field selection. The
// import is an additive policy/v1 feature: hosts expose it when supported,
// while validators continue accepting policy/v1 guests which predate it.
message ReadNormalizedHTTPRequest {}

message NormalizedHTTPResponse {
  bytes path = 1;
  bytes query = 2;
  // Deterministic lower-case "name:value\n" records. Hosts fail with
  // RESOURCE_EXHAUSTED rather than truncate this security-sensitive view.
  bytes headers = 3;
  bytes trusted_source = 4;
  bool trusted_source_authenticated = 5;
  bool body_window_complete = 6;
  uint32 body_window_length = 7;
}

message ReadBodyWindowRequest {
  uint32 offset = 1;
  uint32 length = 2;
}

message StateGetRequest {
  string key = 1;
}

message StatePutRequest {
  string key = 1;
  bytes value = 2;
}

message EmitEventRequest {
  // Security events intentionally contain no guest-controlled strings or
  // bytes. The host owns the stable code/action names and log templates.
  enum Code {
    SECURITY_EVENT_CODE_UNSPECIFIED = 0;
    SECURITY_EVENT_CODE_WAF_RULE_MATCH = 1;
    SECURITY_EVENT_CODE_IP_RULE_MATCH = 2;
    SECURITY_EVENT_CODE_IP_CHECK_FAILURE = 3;
    SECURITY_EVENT_CODE_ROUTING_RULE_MATCH = 4;
    SECURITY_EVENT_CODE_ROUTING_FAILURE = 5;
  }
  enum Action {
    SECURITY_EVENT_ACTION_UNSPECIFIED = 0;
    SECURITY_EVENT_ACTION_OBSERVE = 1;
    SECURITY_EVENT_ACTION_DENY = 2;
    SECURITY_EVENT_ACTION_ALLOW = 3;
    SECURITY_EVENT_ACTION_DIRECT = 4;
    SECURITY_EVENT_ACTION_UPSTREAM = 5;
  }
  enum Reason {
    SECURITY_EVENT_REASON_NONE = 0;
    SECURITY_EVENT_REASON_SOURCE_UNAUTHENTICATED = 1;
    SECURITY_EVENT_REASON_DATASET_UNAVAILABLE = 2;
    SECURITY_EVENT_REASON_CLASSIFICATION_MISSING = 3;
    SECURITY_EVENT_REASON_BUDGET_EXCEEDED = 4;
    SECURITY_EVENT_REASON_UPSTREAM_UNAVAILABLE = 5;
    SECURITY_EVENT_REASON_UPSTREAM_AUTHENTICATION = 6;
    SECURITY_EVENT_REASON_PROTOCOL_UNSUPPORTED = 7;
    SECURITY_EVENT_REASON_DATA_INVALID = 8;
    SECURITY_EVENT_REASON_COVERAGE_UNKNOWN = 9;
    SECURITY_EVENT_REASON_REVOKED = 10;
  }
  enum DomainSource {
    SECURITY_EVENT_DOMAIN_SOURCE_UNSPECIFIED = 0;
    SECURITY_EVENT_DOMAIN_SOURCE_ORIGINAL = 1;
    SECURITY_EVENT_DOMAIN_SOURCE_HTTP_HOST = 2;
    SECURITY_EVENT_DOMAIN_SOURCE_TLS_SNI = 3;
    SECURITY_EVENT_DOMAIN_SOURCE_IP_ONLY = 4;
    SECURITY_EVENT_DOMAIN_SOURCE_UNAVAILABLE = 5;
  }
  Code code = 1;
  Action action = 2;
  // One-based indices into the Host-pinned policy configuration dictionaries;
  // zero means absent. Hosts validate dictionary membership before resolving
  // names. No arbitrary labels or request bytes may be transported by a guest.
  uint32 rule_index = 3;
  uint32 dataset_index = 4;
  uint32 classification_index = 5;
  uint32 outbound_index = 6;
  Reason reason = 7;
  DomainSource domain_source = 8;
}

message AddMetricRequest {
  string name = 1;
  sint64 delta = 2;
}

message BytesResponse {
  bytes value = 1;
  bool found = 2;
}

message ReadTrustedSourceRequest {}

message TrustedSource {
  enum Authority {
    AUTHORITY_UNSPECIFIED = 0;
    AUTHORITY_SOCKET = 1;
    AUTHORITY_XFF = 2;
    AUTHORITY_PROXY = 3;
    AUTHORITY_RELAY = 4;
  }
  string instance_id = 1;
  string generation = 2;
  string entry_id = 3;
  // Exactly 4 or 16 network-order address bytes; no scope or IPv4-mapped IPv6.
  bytes peer_address = 4;
  bytes source_address = 5;
  Authority authority = 6;
}

message TrustedSourceResponse {
  oneof result {
    TrustedSource source = 1;
    RuntimeError error = 2;
  }
}

message DatasetReference {
  string handle = 1;
  string instance_id = 2;
  string generation = 3;
  string source_id = 4;
  string version_digest = 5;
}

message DatasetResolveRequest {
  string source_id = 1;
  uint32 max_duration_micros = 2;
  uint32 max_response_bytes = 3;
}

message DatasetResolveResponse {
  oneof result {
    DatasetReference reference = 1;
    RuntimeError error = 2;
  }
}

message DatasetClassification {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_COUNTRY = 1;
    KIND_REGION = 2;
    KIND_CIDR = 3;
  }
  string name = 1;
  Kind kind = 2;
}

message DatasetQueryRequest {
  DatasetReference reference = 1;
  // 1..64 unique address classifications. Domain queries belong to the RPC
  // target lookup contract, never to the authenticated source admission import.
  repeated DatasetClassification classifications = 2;
  uint32 max_duration_micros = 3; // 1..2000; also bounded by remaining admission.
  uint32 max_response_bytes = 4; // complete protobuf frame, at most 4096.
}

message DatasetMatch {
  enum Coverage {
    COVERAGE_UNSPECIFIED = 0;
    COVERAGE_COVERED = 1;
    COVERAGE_UNKNOWN = 2;
    COVERAGE_UNSUPPORTED_FAMILY = 3;
  }
  uint32 index = 1; // zero-based request index, complete and ordered.
  bool matched = 2;
  Coverage coverage = 3;
}

message DatasetQueryResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_UNAVAILABLE = 2;
    STATUS_MISSING_CLASSIFICATION = 3;
    STATUS_BUDGET_EXCEEDED = 4;
    STATUS_UNAUTHORIZED = 5;
    STATUS_STALE_REFERENCE = 6;
    STATUS_INVALID_DATA = 7;
  }
  DatasetReference reference = 1;
  Status status = 2;
  // No partial matches on failure. A non-match is STATUS_OK, covered, false.
  // The single echoed reference and 64 compact entries fit a 4 KiB frame even
  // at maximum reference-field lengths. No per-entry provenance is repeated.
  repeated DatasetMatch matches = 3;
}
