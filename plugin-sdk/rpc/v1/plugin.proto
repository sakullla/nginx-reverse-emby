syntax = "proto3";

package nre.plugin.rpc.v1;

option go_package = "github.com/sakullla/nginx-reverse-emby/plugin-sdk/go/rpcv1";

// Runtime results carry exactly one success or error field. Hosts reject a
// missing result, conflicting wire fields, false readiness, and unspecified or
// unknown error codes before applying lifecycle state.
enum RuntimeErrorCode {
  RUNTIME_ERROR_CODE_UNSPECIFIED = 0;
  RUNTIME_ERROR_CODE_INVALID_ARGUMENT = 1;
  RUNTIME_ERROR_CODE_PERMISSION_DENIED = 2;
  RUNTIME_ERROR_CODE_RESOURCE_EXHAUSTED = 3;
  RUNTIME_ERROR_CODE_DEADLINE_EXCEEDED = 4;
  RUNTIME_ERROR_CODE_UNAVAILABLE = 5;
  RUNTIME_ERROR_CODE_INCOMPATIBLE_ABI = 6;
  RUNTIME_ERROR_CODE_INTERNAL = 7;
}

service PluginRuntime {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc Prepare(LifecycleRequest) returns (LifecycleResponse);
  rpc Activate(LifecycleRequest) returns (LifecycleResponse);
  rpc InvokeAction(ActionRequest) returns (ActionResponse);
  rpc Stop(LifecycleRequest) returns (LifecycleResponse);
}

message HandshakeRequest {
  string abi = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  string package_digest = 4;
  string artifact_digest = 5;
  repeated string granted_scopes = 6;
  string generation = 7;
}

message HandshakeResponse {
  string abi = 1;
  repeated string capabilities = 2;
}

message LifecycleRequest {
  string generation = 1;
  bytes config = 2;
}

message LifecycleResponse {
  oneof result {
    LifecycleSuccess success = 1;
    RuntimeError error = 2;
  }
}

message LifecycleSuccess {
  bool ready = 1;
}

message ActionRequest {
  string generation = 1;
  string action_id = 2;
  string target_kind = 3;
  string target_id = 4;
}

message ActionResponse {
  oneof result {
    ActionSuccess success = 1;
    RuntimeError error = 2;
  }
}

message ActionSuccess {
  bool accepted = 1;
}

message RuntimeError {
  RuntimeErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}
