        review_result:
          decision: changes_requested
          summary: 最终批未发现超出累计 findings 的新增高置信问题；sqlite_store.go 的变化集中于安全快照注入与 Agent 删除 PKI guard。整体审查仍因前序批次的阻断项请求修改。
          findings: ["P1: panel/backend-go/cmd/nre-control-plane/main.go:660-671、733-739 在构造并获取 canonical PKI lease 之前调用 BootstrapInternalPKI；相邻 panel/backend-go/internal/controlplane/service/certs_pki.go:69-74、179-220 会在 snapshot 缺失时直接使用未受 lease 包装的 vault signer 解密 CA、签名并持久化 snapshot，空状态还会先生成和封存 CA。若首次 bootstrap 在 settings/authority 提交后、snapshot 提交前崩溃，或双实例并发启动，尚非 lease holder 的实例即可使用 CA 并竞争写入同版本安全快照，破坏单活签名边界。最小修复是把初始 lease/bootstrap grant 与 settings 初始化原子建立，并在任何 authority 生成、解密或签名前取得 fence；初始 snapshot 也必须使用 lease-gated signer，并增加双实例及两次提交间崩溃恢复测试。", "P2: panel/backend-go/cmd/nre-control-plane/main.go:529-540 仅把 pkiErr 写入日志并向 router 注入 nil PKIService；相邻 handlers_pki.go:13-18 因而只返回无原因的通用 503。控制入口虽保持在线，但面板/API 无法展示约定的 recovery blocker，也无法区分 master key 损坏、canonical state 无效和暂时 lease 不可用。最小修复是注入只读 degraded PKI status/overview，返回经过脱敏的稳定原因码与恢复提示，同时继续拒绝 mutation/signing，并补充损坏 vault 与无效 state 的 API 测试。", "P2: panel/backend-go/cmd/nre-control-plane/pki_main_test.go:16-84 将真实 router 替换为空 ServeMux，并以已取消 context 运行 App，随后直接调用 AgentService；即使 registration/heartbeat URL、X-Agent-Token HTTP 认证或监听器接线发生回归，这些测试仍会通过，未机械证明 recipe 的稳定控制协议契约。最小修复是使用真实 router/httptest 或可观测 listener 发起 registration、heartbeat、revision/task 请求，验证损坏 master key 时原 URL 与 token 认证仍工作、无需客户端证书且没有第二监听器。", "P3: README.md:70 新增 NRE_PKI_MASTER_KEY_FILE 文档，但仓库标准环境示例 .env.example 未包含该变量，未满足本仓库对新增环境变量同时更新 README 和 examples 的约定。最小修复是在 .env.example 增加带安全说明的注释项，并说明容器使用外部 secret 文件时需挂载对应绝对路径。", "P1: panel/backend-go/internal/controlplane/http/handlers_agents.go:24-31 对无 CSR 请求继续接受长期静态 register token；该路径会在相邻 service/agents.go:583-587 创建或更新可由调用方指定 control token 的 AgentRow，而 service/pki_enrollment.go:241-253、362-438 又允许该 control token 通过 authenticated heartbeat 为尚无 PKI identity 的 agent 首次创建身份和证书。攻击者只需长期静态 register token，即可先注册或接管 agent，再通过 heartbeat 取得 tunnel client certificate，完整绕过要求原子消费的一次性 PKI enrollment token。最小修复是让 authenticated enrollment 对 agent kind 仅允许已有 active identity 的续签；首次登记及 revoked identity 重登记必须走 new/bound one-time token 事务，并在 PKI 启用后禁止静态 register token 创建或改写 PKI agent。补充“静态注册→authenticated CSR”及既有 agent 接管的端到端拒绝测试。", "P2: panel/backend-go/internal/controlplane/app/app_test.go:61-87 在未检查 testing.Short 的情况下启动真实 TCP HTTP server；相邻同类测试明确属于 integration tier 并在 short 模式跳过。该测试会把端口绑定和调度时序带入要求确定性的快速测试层，在受限 CI 中可能造成非业务失败。最小修复是改用可注入的假 server/lifecycle seam，或命名为 Integration 并在 short 模式跳过。", "P3: panel/backend-go/internal/controlplane/config/config.go:194-196 新增 NRE_PKI_MASTER_KEY_FILE 绑定，但 config_test.go 新增测试只检查一个未识别的第二监听器变量，没有验证该安全关键配置从环境进入 Config。环境变量名、空白裁剪或默认行为回归时现有测试仍会通过。最小修复是设置受限绝对路径并断言 PKIMasterKeyFile，另覆盖空白值保持默认。", "P1: panel/backend-go/internal/controlplane/http/handlers_tasks.go:389-430、456-510 的 SendTaskContext 在持有 session mutex 时执行可能阻塞的网络写入/Flush，而 Close 必须先取得同一 mutex 才能 cancel handler、关闭 body。普通 CreateAndDispatch 使用 context.Background，故慢客户端上的既有诊断任务可无限阻塞写入；随后 revoke 的 CloseAgentSessions 会卡在 mutex，无法在五秒内终止 SSE/NDJSON transport。现有 router_test.go:1311 只覆盖空闲 SSE，无法暴露该竞态。最小修复是让 Close 能在等待写锁前立即 cancel transport 并强制当前 write deadline，且所有发送都有默认上限；补充阻塞 writer 下 SSE、NDJSON revoke 均有界退出的测试。", "P1: panel/backend-go/internal/controlplane/localagent/task_bridge.go:72-92 新增的 SendTaskContext 只在派发前检查 ctx，随后 SendTask 把工作放入独立 background/deadline goroutine；Close 不保存或触发 session-wide cancel，反而等待全部 wg 任务自然结束。撤销本地 tunnel identity 时，一个长时间诊断任务会让 CloseAgentSessions 阻塞至任务 deadline，且调用方 context 取消后任务仍继续运行和上报，未实现 scope delta 声明的远程/本地一致关闭语义。最小修复是为 LocalTaskSession 建立可取消的生命周期 context，将调用 context/session cancel 传播到 handleTask，Close 先 cancel 再有界等待，并增加进行中诊断被 revoke 中断的测试。", "P2: panel/backend-go/internal/controlplane/http/handlers_pki.go:236-260 对所有 action 直接用无上限 JSON decoder；protected import 又把相邻 PKIActionRequest.Archive 解码为完整 []byte。合法的大型 SQLite 备份或持有 panel token 的超大请求都可造成多份 base64/JSON 内存分配并拖垮唯一控制监听器，而现有普通 backup import 已有 32 MiB MaxBytesReader 边界。最小修复是为 protected import 使用明确上限的流式/multipart 读取并稳定返回 413，普通 action body 使用更小上限，同时增加超限不调用 service 的测试。", "P2: panel/backend-go/internal/controlplane/http/handlers_pki.go:162、187、262、287 返回一次性 enrollment token、confirmation nonce、protected backup operation/result 及 authenticated PKI GET 资源时均未设置 Cache-Control: no-store/private；这些路由使用自定义 X-Panel-Token，缓存层不会自动按标准 Authorization 视为私有，可能持久化或跨请求复用敏感响应。最小修复是对全部 PKI API 响应设置 no-store（至少 token、confirmation、backup 与 operation），并增加响应头回归测试。", "P1: panel/backend-go/internal/controlplane/service/agents.go:1214-1222、1251-1255 对每次 heartbeat 无条件调用 PKI controller，并将 PrepareRelayListeners/ControlSync 的任意错误作为整个 heartbeat 错误返回；这会在启动后 canonical PKI 状态、lease 或存储临时异常时中断普通 token control，同时时间戳、证书报告等基础副作用已经部分提交，违反 PKI 故障失败关闭但 panel/control protocol 保持可用的契约。最小修复是把 PKI projection/sync 失败隔离为显式 degraded/recovery 状态，继续返回普通 heartbeat，省略或栅栏依赖 PKI 的 relay 配置与签发结果，并增加 controller 运行期失败时普通 heartbeat 仍为 200 的回归测试。", "P1: panel/backend-go/internal/controlplane/service/agents.go:856-865、883-925 在独立 PKI revoked 检查后，跨多个事务清空 HTTP/L4 rules、relay listeners 和 managed-certificate 关联，最后才由 DeleteAgent 再次检查身份状态；若期间 bound re-enrollment 重新激活身份，最终删除会被拒绝，但前述产品关联已经不可逆地丢失，留下仍存在却被部分清空的 Agent。最小修复是把最终 PKI guard、Agent hard delete及数据库内关联清理放入同一事务化 store 操作（文件清理放提交后），并覆盖 guard 后并发 re-enroll/最终删除失败时全部关联保持不变的测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:848-921 的 Activate 未检查 agent/listener identity 是否已 active、是否具备 current certificate 或是否完成所需安全快照确认，就直接调用 finalizer 将全部 listener 切为 pki_mtls；同时只写 succeeded job/event，没有为受影响 agent 创建 revision ledger 或等待应用确认。当前相邻测试甚至允许 enrollment_required identity 完成 activation，导致旧认证被删除后节点无可用凭据，且在线 agent 可能直到下一次无关配置变更才收到切换。最小修复是在同一事务内验证明确的迁移 Gate，生成受影响 agent 的 revision/task 投递并让 operation 在确认前保持 running/blocked；增加未登记 listener 拒绝 activation 及成功 activation 立即产生可领取 revision 的测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:861-916 的 activation 事务只在 863-871 执行一次 lease fence，随后更新 upgrade state、创建成功 job 并追加事件后直接提交，没有最终基于数据库时间复核同一 grant。lease 在首次检查后过期或换届时，旧 holder 仍可提交不可逆的认证切换。最小修复是在所有 activation 写入完成、外层 revision transaction 提交前再次校验同一 term/epoch/deadline，并增加首次 fence 后阻塞至 lease 过期/接管时整笔回滚的测试。", "P1: panel/backend-go/internal/controlplane/service/certs.go:700、856 调用的相邻 rejectCanonicalPKICertificateMutation（certs_pki.go:376-391）先加载完整 canonical PKI state，之后才判断证书是否属于内部域，并且只要 settings 存在就拒绝 internal_ca/relay mutation。结果是 PKI 状态读取故障会连带阻断公网 ACME/uploaded 证书操作，而 migration_required 阶段也无法维护仍在服役的旧 relay 证书，违反公网证书域隔离及 activation 前保留旧认证的契约。最小修复是先按证书类型/usage 快速放行公网证书，仅对内部 relay 类型读取 PKI 状态，并只在 tunnel_mtls_only activation 完成后关闭 generic mutation；补充 degraded PKI 下公网证书仍可修改和 migration 前后边界测试。", "P1: panel/backend-go/internal/controlplane/service/certs_pki.go:179-220 在 canonical security snapshot 缺失时重新签名，但将 RevokedIdentityIDs 和 RevokedSerials 固定为空，而不读取 state 中已 revoked 的 identity/certificate。若撤销后的 snapshot 行损坏或丢失，重启会生成当前 security revision 的有效签名空撤销清单，新安装或恢复的 peer 可能重新信任已撤销凭据，同版本旧 snapshot 还会产生不可收敛的内容分叉。最小修复是对非初始状态的 snapshot 缺失进入明确 recovery blocker，或在持有 lease/fence 时从完整 canonical state 重建排序后的 trust/revocation facts；增加 revoke 后删除 snapshot 再启动的回归测试。", "P2: panel/backend-go/internal/controlplane/service/certs_pki.go:85-105、115-167 在检查 legacy/store 读取及提交 canonical transaction 之前就由 GeneratePKIAuthority 将 CA 私钥密封到最终 vault 路径；任何后续读取、随机 ID 或事务失败都会遗留没有数据库引用的加密 CA 密钥，重试又会创建新 domain/key，持续扩大敏感材料和磁盘残留。最小修复是使用可清理的 staging generation，并仅在 canonical 提交成功后完成发布，或在所有失败路径安全删除未引用 key；注入 Inspect/List/transaction 失败验证 vault 无孤儿。", "P2: panel/backend-go/internal/controlplane/service/control_pki_integration_test.go:20-739 的测试无 integration gate，却反复启动真实 SQLite store、文件 vault、CA 密钥生成和生命周期事务，因此会全部进入 go test -short，与仓库规定的 SQLite lifecycle/full-tier 边界不符并拖慢快速回归层。最小修复是把真实 SQLite/vault 场景移入 integration/full tier，同时以 fake store/signer 保留少量确定性的 short-tier 合约测试。", "P1: panel/backend-go/internal/controlplane/service/pki_enrollment.go:218-253、362-453 先凭 request replay 或 AgentRow 存在性接受 authenticated enrollment，事务内不校验此前认证的 control token 仍非空且与当前值一致；若 revoke 在 HTTP 认证后先提交，旧请求仍可签发证书，并由 SetPKIIdentityCurrentCertificate 重新激活已撤销 identity。最小修复：把认证 token 的摘要或版本带入 enrollment，在 replay 与签发前锁行验证其仍匹配且未禁用，并拒绝 authenticated 路径激活 revoked identity；增加 authenticate→revoke→enroll 的竞态测试。", "P1: panel/backend-go/internal/controlplane/service/pki_enrollment.go:218-230、493-502、525-541 与 panel/backend-go/internal/controlplane/service/pki_backup_sqlite.go:154-166 将 registration replay 永久绑定到 token digest，既不要求 request ID、检查 token expiry，也不验证返回结果对应的 agent/token/certificate 仍有效；备份净化删除 enrollment-token rows 却保留 replay row，因此原始十分钟一次性 token 可在消费、过期乃至恢复后继续取回长期 control token 和证书。最小修复：使用客户端 request ID 和受 token expiry 约束的短 replay 窗口，重放前验证当前凭据状态，并在净化备份中删除 registration replay 或移除其中的凭据；补过期、撤销及备份恢复后的拒绝测试。", "P1: panel/backend-go/internal/controlplane/service/relay.go:770-835 在 revision mutation 开始前先调用 pkiListenerRevoker 提交不可逆的 identity/certificate 撤销，随后配置删除若因并发引用、revision 冲突或存储错误失败，listener 仍保留但凭据已失效且 identity 不可重新登记，失败操作因此造成持久中断。最小修复：把最终依赖检查、listener 删除和 PKI 撤销纳入同一数据库事务，或使用可恢复的持久多阶段删除 job，确保后半段失败可自动完成或补偿；增加撤销提交后删除失败及并发新增引用的回归测试。", "P1: panel/backend-go/internal/controlplane/service/relay_pki_repository.go:395-404 始终以空 excludedAgentID 发布安全快照，而 panel/backend-go/internal/controlplane/service/tasks.go:268-318 会并行向所有现存 session 派发并等待终态；agent revoke 同时关闭目标 session，因此发布通常会向即将被关闭且已 fenced 的目标发送任务，继而超时或失败，使已经提交成功的 revoke 向调用方返回错误并留下 retry_pending job。最小修复：把 agent revocation 的 ControlSessionTargets 传给 publisher 并在枚举前排除，listener revoke 则继续向所属 agent 投递；增加一个被撤销 agent 与一个在线 peer 并存时，目标关闭、peer 确认且收敛成功的测试。", "P1: panel/backend-go/internal/controlplane/storage/migration.go:260-340 在目标 canonical 路径用 O_EXCL 直接复制 master key/vault record，只 fsync 文件而未通过临时文件原子发布并同步父目录；进程终止可留下截断文件，后续重试会因“existing contents differ”永久拒绝，目录项掉电丢失还可能让已提交的目标数据库引用不存在的密钥。最小修复：使用同目录受限 staging、完整写入与 fsync 后原子 no-clobber 发布并 fsync 目录，定义残留恢复/清理协议，并覆盖中途终止、截断目标和发布后重试。", "P2: panel/backend-go/internal/controlplane/service/relay_pki_repository.go:221-260 仅在 succeeded 且本次 convergenceErr 为空时短路；若后台 reconciler 先把 running job 标为 succeeded，而原始 revoke 的较旧收敛尝试随后失败，该旧结果会把终态重新降级为 pending。最小修复：令 succeeded 为不可逆终态，并用 attempt/claim generation 的 CAS 拒绝陈旧完成结果；增加并发旧失败晚于新成功到