        owner_mode: local
        baseline_ref: d80be0117054ea062ae82f76e70b6d35194573af
        observation_base_ref: 0fdfcd299580a0dc74ffdb2a20a80151ad963f7d
        checkpoint_ref: d80be0117054ea062ae82f76e70b6d35194573af
        scope_delta:
