          decision: changes_requested
          summary: 最终批次发现 PKI 状态未纳入存储迁移、Agent 删除会遗留有效 PKI 身份，以及 revision snapshot 未携带声明的安全快照；结合累计阻断项，请求修改。
          findings: ["P1: panel/backend-go/cmd/nre-control-plane/main.go:68、293-299、641-650 在 vault 打开失败、canonical PKI 校验失败或首次初始化竞争失败时直接终止启动，导致现有 PANEL_BACKEND listener、heartbeat/revision/task 与 X-Agent-Token control routes 一并离线；这违反‘仅 PKI 签发/relay 失败关闭、普通控制协议保持可用并展示 recovery blocker’的契约。最小修复是提供显式 degraded PKI runtime/状态：保留现有 handler 和 HTTP listener，拒绝 PKI mutation/signing，并补充损坏或不可读 master key、无效 PKI state 下 token control route 仍可用的启动回归测试。", "P2: panel/backend-go/internal/controlplane/http/handlers_agents.go:32-35 经 mapServiceError 返回注册错误，但客户端提供错误 domain/version 的 pki_security_ack 在 agents_pki.go:89-91、271-279 被包装为 ErrPKILifecycleInvalid，而 router.go:534-583 未映射该错误，最终响应 500；同类 heartbeat ack 也会被误报为服务端故障，破坏可诊断的 payload/error isolation。最小修复是为无效 security acknowledgement 使用专门的 client-input/conflict 错误并映射为稳定 400/409，同时增加 registration 与 heartbeat 的负向 HTTP 测试。", "P1: panel/backend-go/internal/controlplane/http/handlers_pki.go:130-198 与 pki_control_test.go:106-120 接受调用方任意填写的 confirmation_nonce；相邻生产校验仅检查非空，未签发、绑定、过期或原子消费 nonce。因而 revoke、emergency CA rotation、activation 的显式确认门槛可用任意字符串绕过，不能满足高风险操作的服务端确认契约。最小修复是复用或新增服务端签发的短时一次性 nonce，绑定 operator/action/target 并在 mutation 事务中消费，补充伪造、复用及错目标 nonce 的负向测试。", "P1: panel/backend-go/internal/controlplane/http/handlers_pki.go:76-86 构造 PKIEventQuery 时遗漏已有的 ca_generation、from、to 字段，调用方即使传入这些查询参数也会被静默忽略，无法完成要求的 CA 代次和时间范围审计检索，并可能返回过宽事件集。最小修复是解析并验证 CA generation 与 RFC3339 时间边界、拒绝非法或反向区间，并增加各过滤维度的 HTTP 行为测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:153-198（相邻签发提交见 pki_enrollment.go:345-368）逐个独立提交 enrollment，却只在整批成功后返回内存中的 credentials；后续请求失败或响应丢失时，前一证书已成为 current、旧证书已 superseded，但客户端没有拿到新证书，使用同一 CSR 重试还会触发公钥复用拒绝。最小修复是持久化 agent/request_id 与请求指纹、签发结果的幂等映射并可重放响应，同时在客户端确认激活前保留旧证书；批量请求需原子提交或返回不会丢弃已提交结果的逐项状态，并补充第二项失败及响应丢失重试测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:504-552,638-678 的 force rotate、普通/紧急 CA 轮转及受保护导入导出只创建 pending lifecycle job；仓库内没有消费这些 job 的执行器，导入导出的 passphrase 也在校验后被丢弃，且 force rotate 在 512-523 静默忽略状态加载和任务派发错误。接口会返回已受理但操作永久停留 pending。最小修复是接入实际 authority/backup/rotation 执行器，可靠派发并持久化 running/succeeded/failed 与审计结果；passphrase 仅通过内存执行上下文传递，派发失败应立即返回错误或把 job 标记失败，并增加轮询到终态的集成测试。", "P1: panel/backend-go/internal/controlplane/service/agents.go:2030-2035 在 crypto/rand 失败时使用两个 randomAgentID 作为长期控制令牌，而 randomAgentID 的失败分支基于当前秒级时间，令牌可预测并可被用于冒充 agent。最小修复是让 randomAgentControlToken 返回错误并使注册在安全随机源不可用时失败关闭，同时用可注入熵源补充失败路径测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:78-118,286-323 在 enrollment 事务前读取并签署安全快照，随后才独立签发并提交证书；两者之间没有 security revision、CA generation 或 lease fence 一致性检查。并发 CA/安全状态变化可使一次性 token 已消费且证书已提交，但返回的快照版本或 trust generations 与实际签发 authority 不一致，客户端可能无法验证或恢复注册。最小修复是将快照版本/签发 authority 绑定到 enrollment 的事务与 lease fence，提交时校验未变化并在冲突时重试，或从提交后的同一确定状态生成可幂等重放的响应；补充并发轮转期间注册测试。", "P1: panel/backend-go/internal/controlplane/service/pki_enrollment.go:187-197,270-277 只确认 control token 对应的 agent 存在，随后允许为任意 listener_id、DNS 和 IP 创建新的 listener identity；control_pki_integration_test.go:396-437 甚至在没有创建 listener 42 的情况下验证签发成功。持有任一 agent control token 的主体可取得任意 SAN 的 Internal CA server-auth 证书，用于冒充未授权 relay endpoint。最小修复是事务内锁定并验证 listener 已存在且属于该 agent，要求匹配预先创建的 enrollment-required identity，并从 canonical listener 配置派生/校验 SAN；补充不存在、跨 agent 及 SAN 不匹配的拒绝测试。", "P1: panel/backend-go/internal/controlplane/service/pki_enrollment.go:201-267,345-410 在首次注册成功时原子消费 one-time token、生成服务端 agent ID/control token 并提交证书，但没有请求幂等键或已提交响应的重放记录；HTTP 响应丢失后，客户端既不知道生成的 ID/token/certificate，又因 token 已消费而无法重试。现有 control_pki_integration_test.go:199-239 只覆盖提交前失败回滚，未覆盖提交成功后的响应丢失。最小修复是增加客户端 enrollment request ID，将 token digest、CSR 指纹与完整注册结果持久化绑定，重复相同请求返回原结果、载荷冲突则拒绝，并补充 commit 后丢失响应的重试测试。", "P1: panel/backend-go/internal/controlplane/service/pki_enrollment.go:303-405 通过 lease-aware signer 约束解密和签名，却未在证书、identity、token 与事件提交前执行 PKI lease fence；lease 可在签名后的最终检查与事务提交之间过期或被新实例接管，旧 holder 仍能提交新证书。最小修复是让 enrollment 获取并携带具体 lease grant，在同一事务中、所有 canonical 写入提交前调用 RequirePKILeaseFence，并增加签名后 lease 换届/过期时整笔回滚且 token 保持未消费的测试。", "P1: panel/backend-go/internal/controlplane/service/relay.go: canonicalPKIEnabled、List/ListPage、prepareRelayListener 仅以 state.Settings != nil 判断 PKI 已启用；BootstrapInternalPKI 在 migration_required 阶段也会创建 settings，因此维护迁移刚开始就会把 listener 暴露/保存为 pki_mtls 并移除旧 certificate/pin/CA 字段，而不是等 activation 完成。尚未取得 PKI credential 的 relay 会提前失去可用认证。最小修复是区分 migration_required 与 tunnel_mtls_only：迁移期保留旧认证并只附加 enrollment 状态，最终 activation 的原子切换后才强制 pki_mtls，并补充 activation 前后的快照测试。", "P1: panel/backend-go/internal/controlplane/service/relay.go: FinalizeTunnelMTLSUpgrade 先独立删除 managed certificate，再逐 agent 更新 listener，且以 CertificateType == internal_ca 作为删除条件；中途失败会留下部分 listener 引用已删除材料，任何非 relay、usage=https 的 internal_ca 证书也会被误删，违反‘只关闭 relay 旧认证’。最小修复是仅按 relay_ca/relay_tunnel、保留域或真实 listener 关联识别旧 relay 材料，并把证书行、全部 listener 与 upgrade-state/job 终态放入同一事务，提交后再清理文件；补充非 relay internal_ca 保留和中途失败回滚测试。", "P1: panel/backend-go/internal/controlplane/service/relay.go: ensurePKIListenerIdentity 只在 create/update 后创建身份，deleteLegacy/Delete 没有撤销对应 listener identity 及证书。删除后的 server-auth 证书继续有效；若 listener ID 被复用，ensurePKIListenerIdentity 还会直接接受旧的 active/revoked identity，导致旧凭据关联新 listener 或新 listener 无法登记。最小修复是删除时通过 fenced revocation 流程撤销 identity、serial 并发布安全 revision，明确处理 ID 重用，增加已签发 listener 删除和重建测试。", "P1: panel/backend-go/internal/controlplane/service/pki_revocation.go:185-203 在数据库已提交撤销后，使用调用方 ctx 并只尝试一次 snapshot publish/session close；客户端取消或任一消费者暂时失败时，job 已记 succeeded，重复 revoke 又因 identity 已 revoked 无法重试。相邻 tasks.go:214-261 的 RegisterSession 也未与 CloseAgentSessions 串行标记撤销，已在提交前通过认证的请求可在 close 后重新注册 session。最小修复是持久化待收敛 outbox/job phase，以独立的五秒上下文执行并由 reconciler 重试；TaskService 应原子标记 agent 已撤销、关闭现有 session 并拒绝并发后到的注册，补充请求取消、消费者失败及 authenticate/register 竞态测试。", "P1: panel/backend-go/internal/controlplane/service/relay_pki_repository.go:44-156 只在撤销事务开始时调用一次 RequirePKILeaseFence，随后在同一事务内构建并签署 snapshot；即使 lease deadline 在签名期间已过，事务末尾没有再次按数据库时间校验，仍可提交 token disable、revision、event 和证书撤销。最小修复是在所有写入完成且提交前再次验证同一 term/epoch/deadline，过期则整笔回滚，并用可阻塞 signer 覆盖签名跨越 lease deadline 的真实 repository 测试。", "P1: panel/backend-go/internal/controlplane/service/tasks.go:241-261 的 CloseAgentSessions 仅从 map 删除 TaskSession 并调用 Close；相邻 HTTP session 的 Close 只设置 closed 标志，SSE handler 仍等待 request context，NDJSON handler 仍可继续读取并调用 ApplyUpdate。因此撤销后旧的已认证连接并未被终止。最小修复是让 session registration 持有真实的 request cancel/transport closer，Close 必须终止 handler 和 request body，并用真实流式 HTTP 测试验证撤销后连接退出且不能再提交更新。", "P1: panel/backend-go/internal/controlplane/service/tasks.go:264-302 的 PublishPKISecuritySnapshot 把 CreateAndDispatch 写入成功直接当作安全状态已收敛，既不等待 agent completed/持久化确认，也无法用 ctx 中断 TaskSession.SendTask；一个阻塞 session 会卡住后续所有 agent 并泄漏发布 goroutine，而未应用任务的 agent 仍被视为成功。最小修复是提供 context-aware、每 agent 有界的并行发送，持有 task IDs 并在五秒内等待明确的安全版本确认；失败/超时进入可重试状态，并补充阻塞发送、未 ack、失败 ack 与成功 ack 测试。", "P2: panel/backend-go/internal/controlplane/service/relay_pki_api.go:101-110 直接把 PKIAuditEvent 作为 API resource；相邻 PKIAuditEvent 没有 JSON tags，实际响应使用 OccurredAt/CAGeneration 等 Go 字段名，且 agents_pki.go 把 details 投影成双重编码的 {raw_json: \"...\"}，与其它 snake_case、结构化 PKI API 不一致。最小修复是增加带明确 JSON tags 的审计 event view，安全解析 DetailsJSON 为结构化值，并加入完整响应 schema 测试。", "P2: panel/backend-go/internal/controlplane/service/relay_pki_repository.go:109-117 将审计事件 ca_generation 设置为 trusted generations 的最大值，而不是实际签署 snapshot 的 generation；存在更高 prepared CA 时，事件会错误归因到尚未签名的 CA，导致查询和审计结果失真。最小修复是使用并校验 snapshot.SignerGeneration（或事务内锁定的 active authority generation），并补充 active=1、prepared=2 的撤销测试。", "P1: panel/backend-go/internal/controlplane/storage/migration.go:17 的默认存储迁移未复制任何 PKI 表，newSliceForModel 也不支持 PKI 模型；迁移后目标端会重新引导 CA，而已复制 Agent 的确认状态与现存隧道凭据失去对应的 authority/identity/certificate，导致凭据整体失效。最小修复是按依赖顺序一致性复制并校验完整 PKI 图，安全迁移或显式复用 vault/master-key，重置并重新获取 lease，并增加端到端 migrate-storage 凭据可用性测试。", "P1: panel/backend-go/internal/controlplane/storage/sqlite_store.go:725 删除 AgentRow 时没有撤销其 PKI identity/certificates，且 panel/backend-go/internal/controlplane/storage/pki_repository.go:810 的关系校验不检查 agent identity 所属 AgentRow 是否存在；删除后证书仍可保持 active，同 ID 重建还可能继承旧身份。最小修复是让 Agent 删除走 lease-fenced PKI 撤销事务或在撤销完成前拒绝删除，同时加入 Agent 存在性不变量及删除/ID 复用回归测试。", "P1: panel/backend-go/internal/controlplane/storage/snapshot_types.go:21 声明 PKISecurity 应由 revision 携带，但 panel/backend-go/internal/controlplane/storage/sqlite_store.go:330 构造 Snapshot 时从未填充该字段，panel/backend-go/internal/controlplane/service/revision_api.go:506 又直接返回该缺失字段的 snapshot；Agent 可在未收到对应 trust/revocation 安全状态时拉取并应用普通 revision，破坏安全状态先于依赖配置的顺序保证。最小修复是由 canonical PKI 状态为所有 revision snapshot 注入已签名安全快照，或以已确认安全版本显式阻断 revision，并覆盖 epoch/撤销变化后的直接 pull 测试。"]
