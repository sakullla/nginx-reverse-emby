          findings: ["P1: panel/backend-go/cmd/nre-control-plane/main.go:529-540、646-743 将 BootstrapInternalPKI 的 ErrPKILeaseNotHeld 与永久损坏同样处理：关闭 lease/vault、安装 degraded service，且因 pkiRuntime.lease 为 nil 不启动 631-635 的维护重试。共享 state 的另一实例持有 lease 时，本实例会永久 degraded；原 holder 退出后也不会自动接管，除非重启进程。最小修复：保留可恢复的 PKI runtime/supervisor，对 lease 竞争保持 mutation 失败关闭但持续 acquire/bootstrap，成功后原位切换为 healthy；增加双实例共享数据库、holder 退出后 follower 无重启接管的测试。", "P1: panel/backend-go/cmd/nre-control-plane/main.go:692-695 使用 context.Background 同步执行包含数据库 lease、CA 生成和 snapshot 签名的 bootstrap；数据库锁等待或 signer/存储阻塞时 newControlPlaneApp 永不返回，因此既不会启动 PANEL_BACKEND，也不会进入 degraded 状态。最小修复：为启动 bootstrap 使用明确的有界 context，并把超时后的重试交给后台 PKI supervisor，同时立即启动普通控制入口；增加阻塞 lease repository/signer 下控制路由仍能按时上线的测试。", "P2: panel/backend-go/cmd/nre-control-plane/pki_main_test.go:21-99 仍将 newHandlerWithDependencies 替换为空 ServeMux，并直接调用捕获的 AgentService/PKIService；app_test.go:61-88 的真实 TCP 测试同样使用空 ServeMux。registration/heartbeat URL、X-Agent-Token 认证、degraded PKI HTTP 状态和单监听器接线即使回归，这些测试仍会通过。最小修复：使用真实 router 启动应用并发起 registration、heartbeat、revision/task 与 PKI overview 请求，验证原 URL/header、无需客户端证书、degraded 状态码/响应及不存在第二监听器。", "P1: panel/backend-go/internal/controlplane/http/handlers_agents.go:11-33 在校验静态注册令牌、一次性 PKI token 或 X-Agent-Token 前，直接把无界请求体解码为 map[string]json.RawMessage；未认证请求可提交超大 CSR/JSON 占满控制平面内存，拖垮同一 PANEL_BACKEND listener 上的 heartbeat/revision/task 路由。最小修复是在首次 Decode 前使用 http.MaxBytesReader，超限稳定返回 413，并覆盖 legacy 与 CSR registration 的超限测试。", "P1: panel/backend-go/internal/controlplane/http/handlers_tasks.go:413-448、504-539 中 SendTaskContext 在释放 stateMu 后才设置未来写截止时间；若 Close 在两者之间把 session 标记关闭并设置立即截止时间，发送方会随后把该截止时间覆盖为未来 5 秒并继续写，而 handler 已可因 cancel 返回，造成撤销完成后仍写旧连接甚至在 ServeHTTP 返回后使用 ResponseWriter。最小修复是让 closed 检查与初始 deadline 安装相对 Close 原子化，保证 Close 的截止时间不能被后续覆盖，并增加暂停在 closed 检查后的确定性交错测试，断言 Close 返回后不再写入。", "P1: panel/backend-go/internal/controlplane/service/agents.go:510-542 在 canonical PKI settings 存在后，对所有非 CSR registration 强制要求现存 agent 的 X-Agent-Token；因此即使 HTTP handler 已用配置的 register token 放行，首次 legacy registration 或仅在 body 携带既有 agent_token 的兼容请求仍返回 401。该行为与既有 registration 认证不变及 handler 声明保留 static register-token 路径相冲突。最小修复是把 static-token 已认证事实显式传入 service 并保留原注册语义，或仅对明确的 authenticated metadata-update 分支要求 header token，同时增加 PKI settings 存在时 static-token 首次注册和旧 payload 回归测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:151-155、180-192 将 EnrollAuthenticated 返回的所有错误都降级为单项字符串，未知数据库、事务、签名或 runtime 错误默认标成 invalid_request 并继续返回成功 sync；基础设施故障因此被误报为客户端载荷错误，调用方无法进入 degraded 状态，agent 也可能停止正确重试。最小修复是只把明确的 CSR/owner/public-key 等客户端错误转成单项结果，对未知及 runtime/storage 错误返回 typed outer error，并补充注入内部故障的测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:169-175 在没有 enrollment request 时，把 lease、vault 或 signer 不可用转换成空 security snapshot 加 nil error；下游无法区分成功同步与安全快照缺失，可能继续发布依赖配置而不触发 degraded/relay fail-closed 路径。最小修复是返回可识别的 soft-degraded 状态或 typed error，让普通 heartbeat 保持成功但明确抑制依赖 PKI 的配置，并覆盖当前快照缺失时的排序测试。", "P2: panel/backend-go/internal/controlplane/service/agents_pki.go:492-500 使用 strings.Contains(row.DetailsJSON, query.SerialHex) 实现 serial 过滤；短 serial 或恰好出现在其他 JSON 字段中的文本会产生错误命中，审计查询可能返回过宽事件集。最小修复是解析结构化 details 后对 canonical serial 字段做规范化精确比较，或持久化可查询的 serial 列，并增加前缀及其他字段包含相同文本的负向测试。", "P1: panel/backend-go/internal/controlplane/service/agents_pki.go:1201-1214 无条件把任意 previous state 改写为调用方给出的 state/phase，没有校验允许的状态迁移或禁止 terminal job 回到 running；并发重试可重开已 succeeded/failed 的 operation，导致 force-rotate、export/import 重复执行并让最终状态被最后一次写覆盖。最小修复是实现显式状态迁移表并以 expected state 做 CAS，terminal 状态保持不可逆，同时对并发重复调用增加确定性测试。", "P2: panel/backend-go/internal/controlplane/service/agents_pki.go:1221-1230 对不存在的 operation 返回 ErrPKILifecycleInvalid，而不是 not-found 错误；HTTP 错误映射会把正常的未知 operation 查询当成 500，破坏稳定错误契约。最小修复是返回专用 PKI operation-not-found 或现有可映射的 not-found error，并增加未知 ID 返回 404 的 API 测试。", "P1: panel/backend-go/internal/controlplane/service/certs_pki.go:222-227 只要 SecuritySnapshot 非 nil 就直接视为 bootstrap 完成，不校验其 domain、epoch、security revision、JSON/signature 或 trust/revocation 内容；重启时可能把滞后或损坏的快照当成 ready，随后向 agent 发布旧安全状态。最小修复是完整校验 persisted snapshot 与 settings/authorities 一致；初始 revision 可在 lease fence 下重建，非初始不一致则进入明确 degraded/recovery 状态，并增加 stale/corrupt snapshot 启动测试。", "P1: panel/backend-go/internal/controlplane/service/certs.go:1052-1129 的 Issue/issueLegacy 未调用 canonical PKI ownership guard，仍可对 relay_tunnel/internal_ca 记录执行 legacy 签发；certs_pki.go:449-468 的保护仅接入 create/update。调用可与 activation 竞争，在 tunnel_mtls_only 后重新保存并分发旧 relay 凭据，破坏 canonical PKI 独占。最小修复是在签发事务的最终提交前检查当前 PKI upgrade state 与证书用途并拒绝内部 relay 签发，同时覆盖 activation 并发及激活后直接 issue 的回归测试。", "P1: panel/backend-go/internal/controlplane/service/pki_backup_sqlite.go:403-428 仅要求 settings 存在并检查 enrollment token/lease，未要求非初始 security revision 必须存在且匹配 domain、epoch、revision 的有效 full signed security snapshot。pki_backup_test.go:294-313 的 fixture 设置 security_revision=7 却不创建 snapshot row，仍被成功导出和恢复；恢复结果会缺失不可重建的安全状态，导致启动恢复失败或旧 trust/revocation 状态被接受。最小修复是 normal export/restore 强制校验唯一 snapshot row 及其结构化版本、full/signature 与 settings 一致；forced restore 删除 snapshot 并归零 revision 后可重建，同时增加 missing/stale/corrupt snapshot 的负向测试。", "P1: panel/backend-go/internal/controlplane/service/pki_enrollment.go:396 要求 authenticated agent 的身份必须已是 active，但迁移中的已有 agent 身份处于 enrollment_required，导致其 heartbeat/control-token enrollment 永远返回 owner mismatch，无法取得首张客户端证书并推进 PKI 激活。最小修复是允许 authenticated owner 为 enrollment_required 的 agent 完成首次签发，同时继续拒绝 revoked 等非法状态，并在 panel/backend-go/internal/controlplane/service/pki_enrollment_test.go 增加该迁移路径及 revoked 拒绝测试。", "P1: panel/backend-go/internal/controlplane/service/pki_revocation.go:338 将 agent 吊销事实强制限定为至少一张已吊销证书；迁移期 enrollment_required agent 尚无证书，因此即使需要禁用其 control token 和关闭会话，吊销事务也会被验证器回滚。最小修复是允许 agent 的零证书吊销，并以身份状态、token 禁用及会话目标验证提交完整性，同时增加 enrollment_required agent 吊销测试。", "P1: panel/backend-go/internal/controlplane/service/relay.go:860 在 pkiListenerRevoker 为 nil 时仍允许删除 listener；PKI 已存在或运行时降级时，这会保留其 listener identity/证书，随后复用同一 agent/listener ID 会命中旧 identity，使新 listener 继承旧凭据边界。最小修复是在 canonical PKI 存在时要求 revoker 可用，否则在删除事务内失败关闭，并覆盖 revoker 缺失与 ID 复用测试。", "P1: panel/backend-go/internal/controlplane/service/relay_pki_repository.go:420 的 PKITaskSessionCloser 只遍历 ControlSessionTargets，完全忽略 repository 在第 203 行生成的 RelaySessionTargets；listener 吊销的 ControlSessionTargets 为空，因此显式关闭阶段会直接成功但不关闭任何目标会话，仍可将 convergence job 标记成功。最小修复是让 closer 消费并去重 relay targets，调用实际 relay 会话终止能力，并增加 listener-only 吊销的集成测试。", "P1: panel/backend-go/internal/controlplane/service/tasks.go:268 的 CloseAgentSessions 同步调用无 context 的 TaskSession.Close；relay_pki_repository.go:435 即使收到五秒 convergence context，也只能在调用前检查一次，Close 阻塞后 deadline 无法中断，吊销 API 和 durable convergence 记录都可能无限挂起。最小修复是提供可取消且强制有界的关闭接口/实现，并测试 Close 阻塞时仍在 PKIOnlineRevocationConvergence 内返回并保留 retry_pending job。", "P1: panel/backend-go/internal/controlplane/storage/migration.go:269,321 对目标 pki/vault 目录及已存在的 master.key/vault 文件未执行 Lstat；MkdirAll、ReadFile 和 Chmod 都会跟随符号链接，因此预置的 targetRoot/pki 或目标密钥符号链接可使密钥写出 data root，或被当作内容相同的合法文件接受。最小修复是逐级拒绝目标路径中的符号链接，要求已有目标为权限受限的普通文件，并增加目录链接与文件链接拒绝测试。", "P1: panel/backend-go/internal/controlplane/storage/migration.go:186,236 仅加载关系图并做关系校验，没有解析和验证 PKISecuritySnapshotRow 的 domain/epoch/revision、完整快照内容及签名；migration_test.go:63 甚至以 SnapshotJSON `{}` 验证迁移成功。损坏或缺失的安全快照因此可连同已激活身份复制到目标，导致新实例启动降级或向 agent 提供不可验证的安全状态。最小修复是在复制文件和写入目标前执行完整 canonical security snapshot 验证，并将测试 fixture 改为真实签名快照，同时覆盖缺失、畸形及版本不一致的拒绝场景。", "P1: panel/backend-go/internal/controlplane/storage/pki_repository.go:624-684 将 active、pending、superseded 证书统一改为 revoked，却保留 superseded_by_id；随后 validatePKISupersessionGraph 在第 1304 行要求任何带 superseded_by_id 的证书仍必须是 superseded，导致有过轮转历史的身份无法完成吊销，整个事务回滚。最小修复是为 revoked 状态定义并验证保留的历史 lineage，或在吊销时原子清除该引用，并增加‘旧 superseded + 当前 active’整身份吊销测试。", "P1: panel/backend-go/internal/controlplane/storage/pki_repository.go:1238-1293 只验证叶证书的序列、指纹、用途和 CA 签名，没有将证书内的 owner 标识绑定到 PKIIdentityRow，也未将 listener SAN 绑定到 canonical RelayListenerRow；因此由正确 CA 签发但属于另一 agent/listener、或带越权 SAN 的证书仍能通过 CreatePKICertificate 和全图校验。最小修复是按 domain/kind/agent/listener 校验唯一身份 URI/subject，并对 server 证书校验 canonical DNS/IP SAN，增加跨 owner 与额外 SAN 拒绝测试。", "P2: panel/backend-go/internal/controlplane/storage/pki_repository.go:903-925 分两次独立查询读取 settings 和 security snapshot；安全修订事务若在两次查询之间提交，读取方会得到旧 settings 与新 snapshot，并将合法快照误判为超前 canonical state。该瞬时错误会使并发 revision pull 失败。最小修复是用同一 repeatable-read 只读事务或单次联表查询获取两行，并增加修订提交与读取交错测试。", "P1: panel/backend-go/internal/controlplane/storage/sqlite_store.go:854 的跨 Agent relay 引用检查只读取 relay_layers，未检查仍受兼容模型支持的 relay_chain；仅以 legacy relay_chain 引用目标 Agent listener 的规则不会阻止删除，导致 listener 被移除后留下悬空规则。最小修复是同时读取并规范化 relay_layers 与 relay_chain 后检查引用，并在 panel/backend-go/internal/controlplane/storage/traffic_store_test.go 增加 HTTP/L4 legacy-only 引用下删除原子失败的回归测试。"]
