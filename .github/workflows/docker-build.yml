name: Docker Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || github.repository }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Verify Release Gates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go-agent/go.mod
          cache-dependency-path: |
            plugin-sdk/go.sum
            go-agent/go.sum
            panel/backend-go/go.sum

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix panel/frontend ci

      - name: Run Go release tests
        shell: bash
        run: |
          go -C plugin-sdk test -count=1 ./...
          go -C go-agent test -p=16 -count=1 -timeout=30s \
            ./internal/app ./internal/control ./internal/core ./internal/generation ./internal/model ./internal/module \
            ./internal/modules/certs ./internal/modules/channel ./internal/modules/ddns ./internal/modules/diagnostics \
            ./internal/modules/egress ./internal/modules/hostmetrics ./internal/modules/http ./internal/modules/l4 \
            ./internal/modules/pki ./internal/modules/relay ./internal/observability ./internal/plugins/dockerproxy \
            ./internal/plugins/hostapi ./internal/plugins/policy ./internal/plugins/process ./internal/plugins/rpc \
            ./internal/plugins/wasm ./pkg/acmeflow ./pkg/acmeflow/cloudflare
          go -C panel/backend-go test -p=16 -count=1 -timeout=30s \
            ./cmd/nre-control-plane ./cmd/nre-plugin-validator ./internal/controlplane/authz \
            ./internal/controlplane/config ./internal/controlplane/coordinator ./internal/controlplane/dependency \
            ./internal/controlplane/http ./internal/controlplane/localagent ./internal/controlplane/marketplace \
            ./internal/controlplane/observability ./internal/controlplane/pluginhost ./internal/controlplane/plugins \
            ./internal/controlplane/revision ./internal/controlplane/service ./internal/controlplane/storage

      - name: Run frontend release tests
        run: npm --prefix panel/frontend test

      - name: Run deployment release gates
        shell: bash
        run: |
          sh scripts/join-agent.test.sh
          sh scripts/deploy-compose.test.sh
          sh scripts/acme-integration.test.sh
          sh scripts/test-internal-pki-e2e.sh

      - name: Run official market release gate
        shell: pwsh
        run: ./scripts/official-market-release/run.ps1

  docker:
    name: Build And Publish Image
    needs: release-gates
    if: always() && (github.event_name == 'pull_request' || needs.release-gates.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Nginx reverse proxy automation image with panel and direct/front_proxy runtime modes
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Resolve build variables
        id: build-vars
        shell: bash
        run: |
          app_version="dev"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME}"
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
          echo "go_version=go1.27.0" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-vars.outputs.app_version }}
            BUILD_TIME=${{ steps.build-vars.outputs.build_time }}
            GO_VERSION=${{ steps.build-vars.outputs.go_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
