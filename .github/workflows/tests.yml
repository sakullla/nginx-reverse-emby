name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-fast:
    if: github.event_name != 'schedule'
    name: Fast Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - plugin-sdk
          - go-agent
          - panel/backend-go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run fast tests
        working-directory: ${{ matrix.module }}
        run: timeout 2m go test -short -count=1 -timeout=90s ./...

  frontend-fast:
    if: github.event_name != 'schedule'
    name: Fast Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - name: Install dependencies
        working-directory: panel/frontend
        run: npm ci
      - name: Run fast tests
        working-directory: panel/frontend
        run: timeout 2m npm test

  go-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    env:
      NRE_ACME_TEST_CHALLTESTSRV_URL: http://127.0.0.1:8055
      NRE_ACME_TEST_DIRECTORY_URL: https://127.0.0.1:14000/dir
      NRE_ACME_TEST_MANAGEMENT_URL: https://127.0.0.1:15000
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: go-agent
            integration_packages: >-
              ./embedded
              ./internal/app
              ./internal/core
              ./internal/hotrestart
              ./internal/modules/certs
              ./internal/modules/diagnostics
              ./internal/modules/http
              ./internal/modules/l4
              ./internal/modules/relay
              ./internal/platform
              ./pkg/acmeflow
          - module: panel/backend-go
            integration_packages: >-
              ./cmd/nre-control-plane
              ./internal/controlplane/coordinator
              ./internal/controlplane/cutover
              ./internal/controlplane/revision
              ./internal/controlplane/service
              ./internal/controlplane/storage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run full tests
        working-directory: ${{ matrix.module }}
        run: timeout 2m go test -count=1 -timeout=90s ./...
      - name: Start local ACME fixture
        run: |
          docker compose -f scripts/acme-integration/docker-compose.yaml up -d --wait --wait-timeout 60
          docker compose -f scripts/acme-integration/docker-compose.yaml cp pebble:/test/certs/pebble.minica.pem "${RUNNER_TEMP}/pebble.minica.pem"
          echo "SSL_CERT_FILE=${RUNNER_TEMP}/pebble.minica.pem" >> "${GITHUB_ENV}"
      - name: Run integration tests
        working-directory: ${{ matrix.module }}
        run: timeout 10m go test -tags=integration -count=1 -timeout=8m -run '^TestIntegration' ${{ matrix.integration_packages }}
      - name: Stop local ACME fixture
        if: always()
        run: docker compose -f scripts/acme-integration/docker-compose.yaml down --volumes --remove-orphans

  internal-pki-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Internal PKI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/internal-pki/go.mod
          cache-dependency-path: tests/internal-pki/go.mod
      - name: Verify integration tests are discoverable
        working-directory: tests/internal-pki
        shell: bash
        run: |
          discovered="$(go test -tags=integration -list '^TestInternalPKI' ./...)"
          printf '%s\n' "$discovered"
          printf '%s\n' "$discovered" | grep -Eq '^TestInternalPKI'
      - name: Run canonical internal PKI E2E command
        working-directory: tests/internal-pki
        run: go test -tags=integration -count=1 ./...
      - name: Verify POSIX thin wrapper
        run: sh scripts/test-internal-pki-e2e.sh

  frontend-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - name: Install dependencies
        working-directory: panel/frontend
        run: npm ci
      - name: Run full tests
        working-directory: panel/frontend
        run: timeout 2m npm test
