<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <title>Nginx Proxy · 控制台</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <div id="app"></div>
  <script>
  // Prevent theme flash: resolve the stored preference before first paint.
  (function() {
    var legacy = { 'sakura': 'sakura-day', 'cyberpunk': 'sakura-day', 'midnight': 'sakura-night', 'light': 'sakura-day', 'dark': 'sakura-night' };
    var valid = ['fresh-green', 'sakura-day', 'sakura-night', 'business', 'neko-dark'];
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var pref = legacy[saved] || saved;
    if (valid.indexOf(pref) === -1) {
      // "system" or no preference: follow the OS scheme with the sakura pair.
      pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'sakura-night' : 'sakura-day';
    }
    document.documentElement.setAttribute('data-theme', pref);
  })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
